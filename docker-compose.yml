services:
  postgres:
    image: postgres:16-alpine
    container_name: confeitaria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: confeitaria_saas
      POSTGRES_USER: confeitaria_user
      POSTGRES_PASSWORD: confeitaria_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confeitaria_user -d confeitaria_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
